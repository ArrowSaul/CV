main:
  - type: education
    name: 教育
    content:
      - title: 郑州轻工业大学
        duration: 2022 年 09 月 - 2026 年 06 月
        sub: 本科
        detail: 软件工程
      - title: 证书
        detail: CET4，校级奖学金
  - type: skills
    name: 技能
    content:
      - title: 软件技能
        detail:
          1. 熟悉 Java 基础知识，了解JVM内存模型，类加载机制，垃圾回收机制 <br> &nbsp; &numsp;
          2. 熟悉Java并发编程，JUC、ThreadLocal、锁，CAS、AQS，线程池池化技术。<br> &nbsp; &numsp;
          2. 熟练 Redis，了解 Redis 数据结构、持久化机制、过期策略、IO模型、哨兵机制等 <br> &nbsp; &numsp;
          3. 熟悉 MySQL 操作，熟悉事务原理，索引结构，存储引擎、锁机制、日志、MVCC等 <br> &nbsp; &numsp;
          4. 熟悉常见的设计模式，灵活应用在业务开发中，减少业务代码量，提高可读性 <br> &nbsp; &numsp;
          5. 熟悉网络相关知识，熟悉常见的 TCP，UDP，Http 等网络协议 <br> &nbsp; &numsp;
          6. 熟悉 Spring，SpringMVC，Mybatis，SpringBoot 等核心框架，理解基本原理，根据需求熟练开发业务接口 <br> &nbsp; &numsp;
          7. 了解 RabbitMQ，Kafka 消息队列中间件，并应用于业务逻辑中 <br> &nbsp; &numsp;
          8. 了解 SpringCloud，理解分布式微服务基本理论，使用微服务组件 Nacos，Gateway，OpenFegin <br> &nbsp; &numsp;
          9. 了解 Docker，容器化部署微服务，基本操作命令，pull 拉取中间件进行搭建使用 <br> &nbsp; &numsp;
          10. 熟悉常用 Linux 命令，使用 CentOS，Ubuntu 等主流操作系统进行开发 <br> &nbsp; &numsp;
          11. 熟练使用 Git 代码仓库工具，Maven 包管理工具，Postman 请求响应 json 工具，Swagger 接口 Ui 文档
      - title: 其他技能
        detail:
          1. 熟悉各种开源平台与软件资源，有独立开发单体架构项目的能力 <br> &nbsp; &numsp;
          2. 良好的专业英语文档和资料阅读和使用能力 <br> &nbsp; &numsp;
          3. 较强的信息检索能力，能够快速学习新技术与开发环境，适应不同项目需求 <br> &nbsp; &numsp;
          4. 一定的沟通表达能力，能够与不同技术背景的人交流技术问题和方案
      - title: 奖项
        detail:
         md: _data/prize.md 
