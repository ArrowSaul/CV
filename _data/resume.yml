        sub: 后端开发
        tags:
          - SpringCloud
          - Vue
      - title: 碳效智控办公节能管家
        duration: 6 个月
        summary: 本项目为智慧建筑能效管理平台，旨在为企事业单位提供精准的碳足迹追踪与自动化节能调控服务。项目采用单体架构设计，后端基于Spring Boot构建系统，物联网设备接入平台与机器学习模型，通过RabbitMQ实现传感器数据的异步采集，利用Redis缓存动态碳效参数，为楼宇空调、照明、窗帘等设备提供智能启停策略，助力企业平均节能率提升。
        detail:
          md: _data/IOT.md
        sub: 后端开发
        tags:
          - SpringBoot
          - HarmonyOS
          - Vue
