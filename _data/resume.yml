  - type: projects
    name: 项目经历
    content:
      - title: 智媒新闻推荐系统
        duration: 3 个月
        summary: 本项目为推荐高效新闻资讯平台，旨在为用户提供个性化的新闻阅读体验。项目采用前后端分离架构，分为自媒体端，用户端，管理端，后端使用 Spring Boot + Spring Cloud 微服务框架，使用 Kafka、Redis、Elasticsearch 等技术实现海量数据处理和实时推荐。
